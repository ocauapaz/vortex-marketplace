app = "vortex-marketplace-api"
primary_region = "gru"

[build]

# O container roda como uid 1000 e portas abaixo de 1024 exigem CAP_NET_BIND_SERVICE,
# que a máquina do Fly não concede. Thruster escuta numa porta alta.
[env]
  HTTP_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# SQLite mora no volume. Uma máquina só — o volume não é compartilhável.
[[mounts]]
  source = "vortex_data"
  destination = "/rails/storage"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# assume_ssl na production.rb evita que o force_ssl redirecione esse check para https.
[checks]
  [checks.up]
    type = "http"
    port = 8080
    path = "/up"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
